name: Render product video

on:
  workflow_dispatch:
  push:
    paths:
      - 'product.jpg'
      - 'voiceover.mp3'
      - 'subtitles_source.txt'
      - 'subtitles.srt'
      - 'brand.json'
      - 'music.mp3'
      - 'sfx_hook.wav'
      - 'sfx_whoosh.wav'
      - 'render.py'
      - '.github/workflows/render.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and Bengali fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
          fc-cache -f

      - name: Render MP4
        run: python3 render.py

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: mukhallat-product-video
          path: mukhallat-product-video.mp4
          if-no-files-found: error
          retention-days: 7
