name: Render Video

on:
  workflow_dispatch:
  push:
    paths:
      - "input/**"
      - "config.json"
      - "scripts/**"

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Install ffmpeg and Bangla fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fontconfig
          fc-cache -f
          ffmpeg -version | head -1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install pillow numpy

      - name: Render video
        run: python scripts/render.py

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: output/*.mp4
          retention-days: 14
